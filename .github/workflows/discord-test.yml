
name: Discord Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Send Discord test message
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is missing."
            exit 1
          fi

          PAYLOAD='{"content":"🚀 **Project Apollo TCG — Connection Test**\n\nDiscord webhook delivery is working.\n\nThis is a test message, not a Pokémon TCG restock alert.","allowed_mentions":{"parse":[]}}'

          curl --fail --silent --show-error \
            --max-time 20 \
            --retry 2 \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"

          echo "Discord accepted the test message."
